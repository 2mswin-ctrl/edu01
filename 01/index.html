<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도 역사 연표: 형성부터 현재까지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            scroll-behavior: smooth;
        }

        .timeline-container {
            position: relative;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #cbd5e1;
        }

        @media (min-width: 768px) {
            .timeline-container::before {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        .era-tab.active {
            background-color: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .event-card:hover {
            transform: scale(1.02);
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-blue-900 text-white py-12 px-4 text-center shadow-lg relative">
        <!-- Home Button -->
        <div class="absolute top-4 left-4">
            <a href="../index.html" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 transition-colors px-4 py-2 rounded-lg text-sm font-medium border border-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>홈</span>
            </a>
        </div>

        <h1 class="text-3xl md:text-5xl font-bold mb-4">독도 역사 연표</h1>
        <p class="text-blue-100 text-lg max-w-2xl mx-auto">
            화산 활동으로 탄생한 독도의 형성부터 대한민국 영토로서의 수호 역사, 그리고 현대의 갈등과 화해 노력을 한눈에 살펴봅니다.
        </p>
    </header>

    <!-- Navigation Tabs -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-md py-4 overflow-x-auto">
        <div class="flex justify-center min-w-max px-4 space-x-2 md:space-x-4">
            <button onclick="filterEra('era1')" id="btn-era1" class="era-tab active border-2 border-blue-900 px-4 py-2 rounded-full text-sm md:text-base font-semibold transition-all">1. 형성 및 초기 기록</button>
            <button onclick="filterEra('era2')" id="btn-era2" class="era-tab border-2 border-blue-900 px-4 py-2 rounded-full text-sm md:text-base font-semibold transition-all">2. 조선의 관리</button>
            <button onclick="filterEra('era3')" id="btn-era3" class="era-tab border-2 border-blue-900 px-4 py-2 rounded-full text-sm md:text-base font-semibold transition-all">3. 대한제국과 침탈</button>
            <button onclick="filterEra('era4')" id="btn-era4" class="era-tab border-2 border-blue-900 px-4 py-2 rounded-full text-sm md:text-base font-semibold transition-all">4. 광복과 현대</button>
        </div>
    </nav>

    <!-- Timeline Content -->
    <main class="max-w-6xl mx-auto py-12 px-6">
        <div id="timeline" class="timeline-container space-y-12">
            <!-- Content will be injected here by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center mt-12">
        <p>© 대한민국 독도 역사 인터랙티브 가이드</p>
    </footer>

    <script>
        const timelineData = [
            {
                id: 'era1',
                title: '독도의 형성 및 초기 기록 (고대 ~ 16세기)',
                events: [
                    { year: '약 460만~250만 년 전', title: '독도의 탄생', desc: '화산 활동으로 인해 독도가 동해상에 탄생했습니다.' },
                    { year: '1454년', title: '『세종실록지리지』', desc: '우산(독도)과 무릉(울릉도) 두 섬에 대한 기록 수록. 날씨가 맑으면 서로 보인다는 지리적 인접성을 명시했습니다.' },
                    { year: '1481년', title: '『팔도총도』 제작', desc: '동해상에 울릉도와 우산도를 명확히 표기한 지도가 제작되었습니다.' },
                    { year: '1531년', title: '『신증동국여지승람』', desc: '우산도와 울릉도에 대한 상세한 지리적 기록이 포함되었습니다.' }
                ]
            },
            {
                id: 'era2',
                title: '조선 시대의 독도 관리와 수호 (17세기 ~ 19세기)',
                events: [
                    { year: '1667년', title: '『은주시청합기』', desc: "일본 사료에서 오키섬이 일본의 경계이며 울릉도와 독도는 조선의 땅임을 기록했습니다." },
                    { year: '1693년', title: '1차 안용복 사건', desc: '안용복이 일본으로 끌려가 독도가 조선의 영토임을 당당히 주장했습니다.' },
                    { year: '1695년', title: '돗토리번의 답변', desc: "일본 막부의 질문에 '울릉도와 독도는 돗토리번 소속이 아니다'라고 공식 답변했습니다." },
                    { year: '1696년 1월', title: '죽도 도해 금지령', desc: '일본 막부가 자국 어민들에게 울릉도(죽도) 방면 항해를 금지했습니다.' },
                    { year: '1696년', title: '2차 안용복 사건', desc: '안용복이 다시 일본으로 건너가 영유권을 강력하게 피력했습니다.' },
                    { year: '1697년', title: '수토관 제도 신설', desc: '3년에 한 번씩 울릉도 주변을 시찰하는 제도를 마련하여 1894년까지 유지했습니다.' },
                    { year: '1785년', title: '『삼국접양지도』', desc: '일본 실학자 하야시 시헤이가 독도를 조선과 같은 황색으로 칠해 조선 영토로 표기했습니다.' },
                    { year: '1877년', title: '태정관 지령', desc: "일본 최고 행정기관이 '울릉도와 독도는 일본과 관계가 없다'고 공식 결정했습니다." }
                ]
            },
            {
                id: 'era3',
                title: '대한제국기와 일제의 침탈 시도 (20세기 초)',
                events: [
                    { year: '1900년 10월 25일', title: '칙령 제41호 제정', desc: '대한제국이 독도(석도)를 울도군의 관할 구역으로 명문화했습니다.' },
                    { year: '1905년 2월 22일', title: '시마네현 고시 제40호', desc: '일본이 일방적으로 독도를 자국 영토로 편입한다고 발표했습니다.' },
                    { year: '1906년', title: '의정부 『지령 3호』', desc: '울릉군수 심흥택의 보고에 대해 일본의 편입 주장이 근거 없음을 명시했습니다.' }
                ]
            },
            {
                id: 'era4',
                title: '광복 이후 영유권 회복과 현대의 갈등 (1945년 ~ 현재)',
                events: [
                    { year: '1946년 1월 29일', title: 'SCAPIN 제677호', desc: '연합군사령부가 독도를 일본의 통치 범위에서 제외하고 한국 영토로 분류했습니다.' },
                    { year: '1951년 1월 18일', title: '평화선(이승만 라인) 선포', desc: '한국 정부가 독도를 포함한 인접 해양 주권을 선언했습니다.' },
                    { year: '1950년대 초', title: '독도의용수비대 조직', desc: '홍순칠 등 민간인들이 자발적으로 일본의 침투를 막아냈습니다.' },
                    { year: '1953년 9월', title: '독도경비대 상시 주둔', desc: '독도에 대한 실효적 지배를 강화하기 위해 경비대가 주둔하기 시작했습니다.' },
                    { year: '1954년/1962년', title: 'ICJ 회부 거부', desc: '일본의 국제사법재판소 회부 제안에 대해 우리 영토이므로 불필요함을 명확히 했습니다.' },
                    { year: '1965년', title: '한일 국교 정상화 (독도 밀약)', desc: '복잡한 국면 속에 문제를 직접 언급하지 않기로 합의한 시기였습니다.' },
                    { year: '1981년', title: '최초의 독도 주민', desc: '최종덕 씨가 주민등록을 이전하여 실질적인 거주 역사를 만들었습니다.' },
                    { year: '1998년 9월', title: '신한일어업협정 체결', desc: '독도가 중간수역에 포함되면서 영유권 논란에 따른 갈등이 재점화되었습니다.' },
                    { year: '2005년 3월 16일', title: '다케시마의 날 조례 제정', desc: '일본 시마네현의 조례 제정으로 한일 갈등이 심화되었습니다.' },
                    { year: '2006년 4월 25일', title: '노무현 대통령 특별담화', desc: '독도는 우리에게 단순한 섬이 아닌 역사적 상징임을 전 세계에 공표했습니다.' },
                    { year: '현재', title: '지속적인 수호와 평화 모색', desc: '일본의 교과서 왜곡에 대응하며 민간 교류와 연구를 통해 평화적 해결을 노력 중입니다.' }
                ]
            }
        ];

        function filterEra(eraId) {
            // Update Tab UI
            document.querySelectorAll('.era-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(`btn-${eraId}`).classList.add('active');

            // Update Timeline Content
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            const era = timelineData.find(e => e.id === eraId);
            
            const eraHeader = document.createElement('div');
            eraHeader.className = 'text-center mb-12 fade-in';
            eraHeader.innerHTML = `<h2 class="text-2xl md:text-3xl font-bold text-blue-900">${era.title}</h2>`;
            timeline.appendChild(eraHeader);

            era.events.forEach((event, index) => {
                const eventDiv = document.createElement('div');
                eventDiv.className = `relative flex items-center justify-between md:justify-normal mb-8 md:odd:flex-row-reverse group fade-in`;
                eventDiv.style.animationDelay = `${index * 0.1}s`;

                eventDiv.innerHTML = `
                    <!-- Dot -->
                    <div class="absolute left-[13px] md:left-1/2 transform md:-translate-x-1/2 w-4 h-4 bg-blue-600 rounded-full border-4 border-white shadow-sm z-10"></div>
                    
                    <!-- Card Container -->
                    <div class="ml-10 md:ml-0 md:w-[45%]">
                        <div class="event-card bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-600">
                            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-full mb-2">${event.year}</span>
                            <h3 class="text-xl font-bold text-slate-800 mb-2">${event.title}</h3>
                            <p class="text-slate-600 leading-relaxed">${event.desc}</p>
                        </div>
                    </div>
                `;
                timeline.appendChild(eventDiv);
            });
            
            // Avoid jumping to top on initial load
            if (window.scrollY > 100) {
                window.scrollTo({ top: document.querySelector('nav').offsetTop - 20, behavior: 'smooth' });
            }
        }

        // Initialize with Era 1
        window.onload = () => filterEra('era1');
    </script>
</body>
</html>
