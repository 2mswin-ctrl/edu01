<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독도 관련 핵심 용어 및 사료 사전</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 아이콘 로드 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 부드러운 전환 효과를 위한 커스텀 스타일 */
        .card-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 bg-pattern">

    <!-- 헤더 섹션 -->
    <header class="bg-gradient-to-r from-blue-800 to-cyan-700 text-white py-12 px-4 shadow-lg relative overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
        <div class="max-w-5xl mx-auto relative z-10 text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-4 flex items-center justify-center gap-3">
                <i data-lucide="map" class="w-8 h-8 md:w-10 md:h-10"></i>
                독도 인터랙티브 용어 사전
            </h1>
            <p class="text-blue-100 md:text-lg max-w-2xl mx-auto">
                독도는 대한민국의 고유 영토로서 지리적, 역사적, 국제법적 가치를 지닙니다. 
                아래에서 관련 핵심 용어와 주요 사료를 검색하고 확인해 보세요.
            </p>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="max-w-6xl mx-auto px-4 py-8 relative -top-8">
        
        <!-- 검색 및 필터 컨트롤 -->
        <div class="bg-white rounded-xl shadow-md p-4 md:p-6 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between border border-slate-100">
            <!-- 검색바 -->
            <div class="relative w-full md:w-1/2">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
                </div>
                <input type="text" id="searchInput" 
                    class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 transition-colors"
                    placeholder="용어나 키워드를 검색해 보세요... (예: 영해, 안용복)">
            </div>

            <!-- 카테고리 필터 버튼 -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-center" id="filterContainer">
                <button data-filter="all" class="filter-btn active px-4 py-2 rounded-full text-sm font-medium bg-blue-600 text-white shadow transition-colors">전체보기</button>
                <button data-filter="지리" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">영역 및 지리</button>
                <button data-filter="역사" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">역사적 사료</button>
                <button data-filter="갈등" class="filter-btn px-4 py-2 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">수호와 갈등</button>
            </div>
        </div>

        <!-- 용어 카드 그리드 -->
        <div id="dictionaryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 자바스크립트를 통해 카드가 여기에 렌더링 됩니다. -->
        </div>

        <!-- 검색 결과 없음 메세지 -->
        <div id="noResults" class="hidden text-center py-12">
            <i data-lucide="file-question" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
            <h3 class="text-xl font-semibold text-slate-600">검색 결과가 없습니다.</h3>
            <p class="text-slate-500 mt-2">다른 검색어를 입력하거나 필터를 변경해 보세요.</p>
        </div>

        <!-- 모달 (팝업) 영역 -->
        <div id="termModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
            <!-- 배경 오버레이 -->
            <div id="modalOverlay" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 cursor-pointer"></div>
            
            <!-- 모달 컨텐츠 -->
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg relative z-10 transform scale-95 opacity-0 transition-all duration-300" id="modalContent">
                <!-- 닫기 버튼 -->
                <button id="closeModalBtn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 rounded-full p-1.5 hover:bg-slate-200 focus:outline-none">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                
                <div class="p-8">
                    <div class="flex items-center gap-3 mb-5" id="modalHeader">
                        <!-- 자바스크립트로 카테고리 뱃지와 아이콘 삽입 -->
                    </div>
                    <h2 class="text-3xl font-bold text-slate-800 mb-6" id="modalTitle">용어 제목</h2>
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-100 shadow-inner">
                        <p class="text-slate-700 leading-relaxed text-lg" id="modalDesc">용어 설명이 여기에 들어갑니다.</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center mt-12 border-t-4 border-blue-600">
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center gap-2">
            <i data-lucide="shield-check" class="w-8 h-8 text-blue-400 mb-2"></i>
            <p class="text-lg text-slate-200 font-semibold mb-2">"독도는 역사적, 지리적, 국제법적으로 명백한 대한민국의 고유 영토입니다."</p>
            <p class="text-sm">제공된 문서 자료를 바탕으로 제작된 인터랙티브 용어 사전</p>
        </div>
    </footer>

    <!-- 기능 구현 스크립트 -->
    <script>
        // 용어 데이터 정의 (마크다운 기반)
        const dictionaryData = [
            { id: 1, category: "지리", categoryLabel: "영역 및 지리", term: "영토(領土)", description: "국가의 주권이 미치는 지표상의 범위입니다.", icon: "globe" },
            { id: 2, category: "지리", categoryLabel: "영역 및 지리", term: "영해(領海)", description: "영토와 인접한 바다로, 보통 기선(기준선)으로부터 <strong>12해리</strong>(약 22km)까지의 수역을 의미합니다.", icon: "waves" },
            { id: 3, category: "지리", categoryLabel: "영역 및 지리", term: "영공(領空)", description: "국가의 주권이 미치는 영토와 영해의 수직 상공(대기권 이내)입니다.", icon: "cloud" },
            { id: 4, category: "지리", categoryLabel: "영역 및 지리", term: "접속수역(接續水域)", description: "영해 밖 기선에서 <strong>24해리</strong> 이내의 수역으로, 관세·방역·출입국 관리 등을 위해 국가의 통제권이 행사됩니다.", icon: "ship" },
            { id: 5, category: "지리", categoryLabel: "영역 및 지리", term: "배타적 경제수역(EEZ)", description: "기선에서 <strong>200해리</strong>까지의 수역 중 영해를 제외한 범위입니다. 연안국은 이 구역 내의 어업 및 천연자원에 대해 배타적 권리를 가집니다.", icon: "anchor" },
            { id: 6, category: "지리", categoryLabel: "영역 및 지리", term: "가스 하이드레이트", description: "'불타는 얼음'으로 불리는 고체 에너지원입니다. 독도 주변 심해저에 풍부하게 매장되어 있어 경제적 가치가 매우 높습니다.", icon: "flame" },
            
            { id: 7, category: "역사", categoryLabel: "역사적 사료", term: "세종실록지리지 (1454)", description: "\"우산(독도)과 무릉(울릉도) 두 섬은 날씨가 맑으면 서로 바라볼 수 있다\"고 기록되어 독도가 인지되고 있었음을 증명합니다.", icon: "book-open" },
            { id: 8, category: "역사", categoryLabel: "역사적 사료", term: "은주시청합기 (1667)", description: "일본의 고문헌으로, 일본의 경계를 오키섬으로 한정하여 독도가 일본 영토가 아님을 스스로 밝히고 있습니다.", icon: "scroll" },
            { id: 9, category: "역사", categoryLabel: "역사적 사료", term: "태정관 지령 (1877)", description: "당시 일본 최고 행정기관이 <strong>\"독도는 일본과 관계가 없다\"</strong>고 공식적으로 인정한 문서입니다.", icon: "file-signature" },
            { id: 10, category: "역사", categoryLabel: "역사적 사료", term: "칙령 제41호 (1900)", description: "대한제국이 독도를 '석도'로 명명하고 울도군 관할로 명문화하여 국제적으로 영유권을 선포한 법령입니다.", icon: "landmark" },
            { id: 11, category: "역사", categoryLabel: "역사적 사료", term: "SCAPIN 제677호 (1946)", description: "연합군최고사령관 지령으로, 전후 독도를 일본의 통치 범위에서 제외하여 한국 영토로 분류했습니다.", icon: "scale" },
            
            { id: 12, category: "갈등", categoryLabel: "수호와 갈등", term: "안용복 사건", description: "조선 숙종 때 일본으로 건너가 독도가 조선 땅임을 확약받고 일본 어민의 침범에 항의한 민간 외교 활동입니다.", icon: "user" },
            { id: 13, category: "갈등", categoryLabel: "수호와 갈등", term: "평화선 (이승만 라인)", description: "1952년 한국 정부가 독도를 포함한 인접 해양의 주권을 보호하기 위해 설정한 해상 경계선입니다.", icon: "navigation" },
            { id: 14, category: "갈등", categoryLabel: "수호와 갈등", term: "독도의용수비대", description: "1950년대 초 6·25 전쟁의 혼란기에 홍순칠 등 민간인들이 자발적으로 결성하여 일본의 침투로부터 독도를 지켜낸 조직입니다.", icon: "shield" },
            { id: 15, category: "갈등", categoryLabel: "수호와 갈등", term: "신한일어업협정 (1998)", description: "UN 해양법 협약에 따라 체결되었으나, 독도가 '중간수역'에 포함되면서 영유권 논란의 불씨가 되기도 했습니다.", icon: "file-warning" },
            { id: 16, category: "갈등", categoryLabel: "수호와 갈등", term: "중간수역", description: "한일 양국이 공동으로 어업 자원을 관리하기 위해 설정한 수역입니다.", icon: "map-pin" },
            { id: 17, category: "갈등", categoryLabel: "수호와 갈등", term: "다케시마의 날", description: "2005년 일본 시마네현이 독도 영유권을 주장하며 지정한 조례로, 한국인의 공분을 사고 있는 역사 왜곡의 사례입니다.", icon: "alert-triangle" }
        ];

        // DOM 요소
        const grid = document.getElementById('dictionaryGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const noResults = document.getElementById('noResults');

        // 모달 DOM 요소
        const termModal = document.getElementById('termModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalHeader = document.getElementById('modalHeader');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        // 상태 변수
        let currentFilter = 'all';
        let currentSearch = '';

        // 초기화
        function init() {
            renderCards(dictionaryData);
            setupEventListeners();
        }

        // 카드 렌더링 함수
        function renderCards(data) {
            grid.innerHTML = '';
            
            if (data.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                
                data.forEach(item => {
                    // 카테고리별 테마 색상 설정
                    let themeColor, badgeBg;
                    if(item.category === '지리') { themeColor = 'text-blue-600'; badgeBg = 'bg-blue-100 text-blue-700'; }
                    else if(item.category === '역사') { themeColor = 'text-amber-600'; badgeBg = 'bg-amber-100 text-amber-700'; }
                    else { themeColor = 'text-red-600'; badgeBg = 'bg-red-100 text-red-700'; }

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl p-6 border border-slate-100 card-transition card-hover flex flex-col h-full cursor-pointer';
                    card.onclick = () => openModal(item.id);
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold tracking-wide ${badgeBg}">
                                ${item.categoryLabel}
                            </span>
                            <i data-lucide="${item.icon}" class="w-6 h-6 ${themeColor} opacity-70"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 mb-3 leading-tight">${highlightSearch(item.term, currentSearch)}</h3>
                        <p class="text-slate-600 leading-relaxed text-sm flex-grow">${highlightSearch(item.description, currentSearch)}</p>
                    `;
                    grid.appendChild(card);
                });
                
                // 새로 추가된 요소를 위해 Lucide 아이콘 재초기화
                lucide.createIcons();
            }
        }

        // 검색어 하이라이트 처리 함수
        function highlightSearch(text, keyword) {
            if (!keyword) return text;
            const regex = new RegExp(`(${keyword})`, 'gi');
            return text.replace(regex, '<mark class="bg-yellow-200 text-yellow-900 rounded px-0.5">$1</mark>');
        }

        // 데이터 필터링 로직
        function filterData() {
            let filtered = dictionaryData;

            // 1. 카테고리 필터링
            if (currentFilter !== 'all') {
                filtered = filtered.filter(item => item.category === currentFilter);
            }

            // 2. 검색어 필터링
            if (currentSearch.trim() !== '') {
                const keyword = currentSearch.toLowerCase();
                filtered = filtered.filter(item => 
                    item.term.toLowerCase().includes(keyword) || 
                    item.description.toLowerCase().includes(keyword)
                );
            }

            renderCards(filtered);
        }

        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 검색바 입력 이벤트
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                filterData();
            });

            // 필터 버튼 클릭 이벤트
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // 버튼 스타일 업데이트
                    filterBtns.forEach(b => {
                        b.classList.remove('bg-blue-600', 'text-white', 'shadow');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    e.target.classList.remove('bg-slate-100', 'text-slate-600');
                    e.target.classList.add('bg-blue-600', 'text-white', 'shadow');

                    // 필터 적용
                    currentFilter = e.target.dataset.filter;
                    filterData();
                });
            });

            // 모달 닫기 이벤트 (버튼 클릭, 배경 클릭)
            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', closeModal);
            
            // ESC 키 누르면 모달 닫기
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !termModal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        }

        // 모달 열기 함수
        function openModal(id) {
            const item = dictionaryData.find(d => d.id === id);
            if (!item) return;

            let themeColor, badgeBg;
            if(item.category === '지리') { themeColor = 'text-blue-600'; badgeBg = 'bg-blue-100 text-blue-700'; }
            else if(item.category === '역사') { themeColor = 'text-amber-600'; badgeBg = 'bg-amber-100 text-amber-700'; }
            else { themeColor = 'text-red-600'; badgeBg = 'bg-red-100 text-red-700'; }

            modalHeader.innerHTML = `
                <span class="px-3 py-1 rounded-md text-sm font-bold tracking-wide ${badgeBg}">
                    ${item.categoryLabel}
                </span>
                <i data-lucide="${item.icon}" class="w-6 h-6 ${themeColor}"></i>
            `;
            modalTitle.innerHTML = item.term;
            modalDesc.innerHTML = item.description;

            lucide.createIcons(); // 모달 내 아이콘 다시 렌더링

            // 모달 보이기
            termModal.classList.remove('hidden');
            
            // 애니메이션 적용을 위한 약간의 지연
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalOverlay.classList.add('opacity-100');
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
            
            // 배경 스크롤 방지
            document.body.style.overflow = 'hidden';
        }

        // 모달 닫기 함수
        function closeModal() {
            modalOverlay.classList.remove('opacity-100');
            modalOverlay.classList.add('opacity-0');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            
            // 애니메이션이 끝난 후 hidden 처리 (transition duration 시간과 맞춤)
            setTimeout(() => {
                termModal.classList.add('hidden');
                document.body.style.overflow = ''; // 스크롤 복구
            }, 300);
        }

        // 페이지 로드 시 초기화 및 아이콘 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            init();
            lucide.createIcons();
        });
    </script>
</body>
</html>
